<!DOCTYPE html> 
<html lang="en">
    <head> 
        <title> 
            MediSlot
        </title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="data:,">
        <link rel="icon" href="assets/favicon.svg">
    </head>

    <body> 

        <header> 
            <h1><a href="index.html" class="brand-logo">MediSlot</a></h1>
            <nav>
                <a href="index.html" class="active">Doctors</a>
                <a href="slots.html" id="nav-slots-link">Slots</a>
                <a href="bookings.html">Bookings</a>
            </nav>
        </header>

        <main>
            <div class="container">
                <section class="hero">
                    <div class="hero-text">
                        <h2>Book appointments in minutes.</h2>
                        <p class="muted">
                        Choose a doctor, pick a slot, and confirm your booking — fast and simple.
                        </p>
                    </div>

                    <div class="hero-media">
                        <img src="assets/hero.svg" alt="Health illustration" />
                    </div>
                </section>

                <!-- Search and Specialty Filter Section -->
                <div class="search-filter-section">
                    <div class="search-box">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="doctor-search" placeholder="Search doctors, specialties, or locations..." />
                    </div>

                    <div class="filter-pills" id="specialty-filters">
                        <button type="button" class="filter-pill active" data-specialty="ALL">All Doctors</button>
                        <button type="button" class="filter-pill" data-specialty="Cardiologist">Cardiology</button>
                        <button type="button" class="filter-pill" data-specialty="Dermatologist">Dermatology</button>
                        <button type="button" class="filter-pill" data-specialty="Pediatrician">Pediatrics</button>
                    </div>
                </div>

                <h2 style="margin: 24px 0 16px 0;">Available Doctors</h2>

                <div class="doctor-list" id="doctors-list"></div>
            </div>
        </main>

        <script src="api.js"></script>
        <script src="app.js"></script>
        <script src="index.js"></script>

    </body>
</html>
