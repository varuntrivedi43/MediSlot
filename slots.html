<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediSlot | Slots</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/favicon.svg">
</head>
<body>
    <header>
        <h1>MediSlot</h1>
        <nav>
            <a href="index.html">Doctors</a>
            <a href="slots.html" id="nav-slots-link" class="active">Slots</a>
            <a href="bookings.html">Bookings</a>
        </nav>
    </header>
    <main class="container">
        <h2>Select a Slot</h2>
        <a id="back-link" href="index.html">← Back</a>
        
        <div class="slots-layout">
            <!-- LEFT: slots -->
            <section class="panel stack-12">
                <div class="panel-head">
                    <div>
                        <h3>Choose a Slot</h3>
                        <p class="muted">Pick a time that works best for you.</p> 
                    </div>

                    <img class="mini-illus" src="assets/calendar.svg" alt="Calendar" />
                </div>
                <p id="doctor-name">Doctor: Dr. Asha Sharma</p>
                <p id="selected-slot">Selected slot: none</p>
                <div class="slots" id="slots-list"></div>
            </section>
            
            <!-- RIGHT: form -->
            <section class="panel stack-12"> 
                <h3>Patient Details</h3>
                <p id="booking-message"></p>

                <form class="booking-form" method="POST">
                    <label for="fullName">Full Name</label>
                    <input id="fullName" name="fullName" type="text" required>

                    <label for="phone">Phone</label>
                    <input id="phone" name="phone" type="tel" required>

                    <button type="submit" id="confirm-booking" class="primary-btn">Confirm Booking</button>
                </form>
            </section>
        </div>
    </main>
    <script src="slots.js"></script>
    <script src="app.js"></script>
</body>
</html>
