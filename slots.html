<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediSlot | Slots</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>MediSlot</h1>
        <nav>
            <a href="index.html">Doctors</a>
            <a href="slots.html">Slots</a>
        </nav>
    </header>
    <main>
        <h2>Select a Slot</h2>
        <a id="back-link" href="index.html">← Back</a>
        <p id="doctor-name">Doctor: Dr. Asha Sharma</p>
        <p id="selected-slot">Selected slot: none</p>
        <div class="slots">
            <button type="button">10:00 AM</button>
            <button type="button">10:30 AM</button>
            <button type="button">11:00 AM</button>
            <button type="button">11:30 AM</button>
            <button type="button">12:00 PM</button>
            <button type="button">12:30 PM</button>
        </div>
        <h3>Patient Details</h3>
        <p id="booking-message"></p>

        <form class="booking-form" method="POST">
            <label for="fullName">Full Name</label>
            <input id="fullName" name="fullName" type="text" required>

            <label for="phone">Phone</label>
            <input id="phone" name="phone" type="tel" required>

            <button type="submit" id="confirm-booking" class="primary-btn">Confirm Booking</button>
        </form>
    </main>
    <script src="data.js"></script>
    <script src="slots.js"></script>
</body>
</html>
