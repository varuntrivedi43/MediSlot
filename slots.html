<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediSlot | Slots</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/favicon.svg">
</head>
<body>
    <header>
        <h1><a href="index.html" class="brand-logo">MediSlot</a></h1>
        <nav>
            <a href="index.html">Doctors</a>
            <a href="slots.html" id="nav-slots-link" class="active">Slots</a>
            <a href="bookings.html">Bookings</a>
        </nav>
    </header>
    <main class="container stack-12">
        <div style="margin-bottom: 8px;">
            <a href="index.html" class="btn-back" id="back-link">← Doctor Profile</a>
        </div>

        <div class="slots-layout-grid">
            <!-- Left Column: Doctor Info & Time Slots -->
            <section class="panel">
                <div class="slots-header">
                <div>
                    <h2 id="doctor-name">Doctor Details</h2>
                    <p class="muted">Pick an available time slot for your appointment.</p>
                </div>
                <img src="assets/calendar.svg" alt="Calendar illustration" />
                </div>

                <div class="selected-slot-bar">
                    <span id="selected-slot">Selected slot: none</span>
                    <button type="button" id="clear-slot-btn" class="danger-btn" style="padding: 4px 10px; font-size: 0.8rem;" disabled>
                        Clear
                    </button>
                </div>

                <h4 style="margin-top: 20px; font-size: 0.95rem;">Available Time Slots</h4>
                <div class="slots" id="slots-list"></div>
            </section>

            <!-- Right Column: Patient Details Form -->
            <section class="panel">
                <h3 style="margin-bottom: 4px;">Patient Details</h3>
                <p class="muted" style="font-size: 0.85rem; margin-bottom: 16px;">Enter details to confirm booking.</p>

                <form class="booking-form">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="e.g. Rahul Sharma" required />
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="10-digit mobile number" maxlength="10" required />
                </div>

                <div id="booking-message" style="margin-top: 8px;"></div>

                <button type="submit" id="confirm-booking" class="primary-btn" disabled style="margin-top: 12px;">
                    Confirm Booking
                </button>
                </form>
            </section>
        </div>
    </main>
    <script src="api.js"></script>
    <script src="app.js"></script>
    <script src="slots.js"></script>
</body>
</html>
